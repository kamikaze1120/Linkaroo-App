<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Linkaroo — Safe Contact Sharing</title>
  <desc id="desc">Animated night-sky banner: two phones exchange pulsing NFC waves around a gold consent shield.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/><stop offset=".52" stop-color="#071238"/><stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".66"/><stop offset=".34" stop-color="#8d22ff" stop-opacity=".3"/><stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCloud">
      <stop stop-color="#ffe69b" stop-opacity=".5"/><stop offset=".3" stop-color="#f0ad38" stop-opacity=".2"/><stop offset="1" stop-color="#b76f08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentCloud">
      <stop stop-color="#4cc3ff" stop-opacity=".42"/><stop offset=".4" stop-color="#2a6bff" stop-opacity=".16"/><stop offset="1" stop-color="#2a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/><stop offset=".28" stop-color="#ffe293"/><stop offset=".55" stop-color="#f4bb4d"/><stop offset=".82" stop-color="#fff0b7"/><stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".14"/><stop offset=".45" stop-color="#af75ff" stop-opacity=".08"/><stop offset="1" stop-color="#f6c35b" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#d7b5ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#c68cff" opacity=".78"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000017" flood-opacity=".8"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="270" cy="130" rx="340" ry="210" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="310;380;310" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1000" cy="270" rx="300" ry="190" fill="url(#goldCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="170;225;170" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="150" rx="220" ry="150" fill="url(#accentCloud)" filter="url(#blur)">
      <animate attributeName="opacity" values=".5;1;.5" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="520" fill="url(#stars)" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(770 120)">
      <rect width="96" height="176" rx="18" fill="#0a0f2e" stroke="url(#gold)" stroke-width="2"/>
      <rect x="8" y="14" width="80" height="140" rx="10" fill="#101845" stroke="#4cc3ff" stroke-opacity=".35"/>
      <rect x="36" y="6" width="24" height="3" rx="1.5" fill="#f4c65a" opacity=".6"/>
      <circle cx="48" cy="52" r="16" fill="#1b2560" stroke="#CB55FF" stroke-opacity=".7"/>
      <text x="48" y="57" text-anchor="middle" fill="#ffe293" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">A</text>
      <rect x="20" y="80" width="56" height="6" rx="3" fill="#d9c7f2" opacity=".35"/>
      <rect x="26" y="94" width="44" height="6" rx="3" fill="#d9c7f2" opacity=".22"/>
      <rect x="20" y="116" width="56" height="20" rx="10" fill="#4cc3ff" fill-opacity=".18" stroke="#4cc3ff" stroke-opacity=".6"/>
      <text x="48" y="130" text-anchor="middle" fill="#bfe9ff" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="8" letter-spacing="1">CONSENT</text>
    </g>
    <g transform="translate(1034 120)">
      <rect width="96" height="176" rx="18" fill="#0a0f2e" stroke="url(#gold)" stroke-width="2"/>
      <rect x="8" y="14" width="80" height="140" rx="10" fill="#101845" stroke="#4cc3ff" stroke-opacity=".35"/>
      <rect x="36" y="6" width="24" height="3" rx="1.5" fill="#f4c65a" opacity=".6"/>
      <circle cx="48" cy="52" r="16" fill="#1b2560" stroke="#CB55FF" stroke-opacity=".7"/>
      <text x="48" y="57" text-anchor="middle" fill="#ffe293" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">B</text>
      <rect x="20" y="80" width="56" height="6" rx="3" fill="#d9c7f2" opacity=".35"/>
      <rect x="26" y="94" width="44" height="6" rx="3" fill="#d9c7f2" opacity=".22"/>
      <rect x="20" y="116" width="56" height="20" rx="10" fill="#4cc3ff" fill-opacity=".18" stroke="#4cc3ff" stroke-opacity=".6"/>
      <text x="48" y="130" text-anchor="middle" fill="#bfe9ff" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="8" letter-spacing="1">CONSENT</text>
    </g>
    <g>
      <path d="M876 190 A18 18 0 0 1 876 226" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></path>
      <path d="M876 176 A32 32 0 0 1 876 240" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="0.35s" repeatCount="indefinite"/></path>
      <path d="M876 162 A46 46 0 0 1 876 254" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="0.70s" repeatCount="indefinite"/></path>
      <path d="M1024 190 A18 18 0 0 0 1024 226" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="1.20s" repeatCount="indefinite"/></path>
      <path d="M1024 176 A32 32 0 0 0 1024 240" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="1.55s" repeatCount="indefinite"/></path>
      <path d="M1024 162 A46 46 0 0 0 1024 254" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="1.90s" repeatCount="indefinite"/></path>
    </g>
    <g transform="translate(950 208)">
      <circle r="58" fill="none" stroke="#f7c758" stroke-width="1.4" stroke-dasharray="4 10" opacity=".7">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="78" fill="none" stroke="#bc52ff" stroke-width="1" stroke-dasharray="2 12" opacity=".5">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="36s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -30 L24 -20 V2 C24 18 12 28 0 34 C-12 28 -24 18 -24 2 V-20 Z" fill="#160f38" stroke="url(#gold)" stroke-width="2.4" filter="url(#glow)"/>
      <path d="M-10 2 L-2 10 L12 -8" fill="none" stroke="#ffe293" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M818 330 H1082" stroke="url(#gold)" stroke-width="1.4" stroke-dasharray="3 9" opacity=".55"/>
    <circle cy="330" r="4.5" fill="#4cc3ff" filter="url(#glow)">
      <animate attributeName="cx" values="818;1082;818" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="950" y="356" text-anchor="middle" fill="#9fb9e8" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2.5">MASKED UNTIL BOTH SAY YES</text>


    <g filter="url(#shadow)">
      <rect x="60" y="52" width="660" height="316" rx="28" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".8"/>
      <rect x="72" y="64" width="636" height="292" rx="22" fill="url(#glass)" stroke="#d38cff" stroke-opacity=".26"/>
    </g>
    <path d="M102 100H300" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="102" cy="100" r="5" fill="#ffd66f" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="120" y="105" fill="#f9d777" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3">V0 PROTOTYPE / NEXT.JS 15</text>
    <text x="102" y="190" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="3">LINKAROO</text>
    <text x="104" y="236" fill="#d9c7f2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18">Privacy-first contact sharing with mutual consent.</text>
    <g transform="translate(104 266)"><rect width="162" height="40" rx="20" fill="#160f38" fill-opacity=".8" stroke="#d34cff" stroke-opacity=".7"/><circle cx="22" cy="20" r="5" fill="#4cc3ff" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle><text x="38" y="25" fill="#f0e2ff" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.3">UI PROTOTYPE</text></g>
    <g transform="translate(280 266)"><rect width="111" height="40" rx="20" fill="#1d1732" fill-opacity=".8" stroke="#f3c454" stroke-opacity=".7"/><text x="22" y="25" fill="#f0e2ff" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.3">NFC · QR</text></g>
    <g transform="translate(405 266)"><rect width="153" height="40" rx="20" fill="#111331" fill-opacity=".8" stroke="#4cc3ff" stroke-opacity=".7"/><text x="22" y="25" fill="#f0e2ff" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.3">CONSENT-FIRST</text></g>
    
    <rect x="0" y="0" width="1200" height="420" rx="30" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="400" rx="23" fill="none" stroke="#c44fff" stroke-opacity=".16"/>
    <rect x="0" y="-45" width="1200" height="34" fill="#f7cf68" opacity=".045"><animate attributeName="y" values="-45;450" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
